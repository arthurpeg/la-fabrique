[project]
name = "la-fabrique"
version = "0.0.0"
description = "Du papier academique au signal juge par du code deterministe."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastembed>=0.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=16",
    "pypdf==6.14.2",  # D19 : la version fait partie de la definition du texte qui fait foi
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
