[project]
name = "la-fabrique"
version = "0.0.0"
description = "Du papier academique au signal juge par du code deterministe."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
