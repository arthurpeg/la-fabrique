<title>Pupitre de la Fabrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Pupitre de laboratoire : bandeau de chiffres, puis une mosaïque de tuiles ;
   le détail s'ouvre dans un tiroir à droite, jamais en quittant la page. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --sunk:#eceef3; --ink:#15171c; --muted:#5b6270;
  --line:#d8dce4; --accent:#2944c9; --accent-soft:#e3e8fb;
  --pos:#1d7f47; --neg:#b93627; --warn:#9a6412; --pos-soft:#dcefe3; --neg-soft:#f6e0dc; --warn-soft:#f5ead7;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1116; --panel:#171a21; --sunk:#1e222b; --ink:#e7eaf0; --muted:#98a0ad;
  --line:#2b313c; --accent:#91a5ff; --accent-soft:#232b48;
  --pos:#58c98f; --neg:#ff7d6c; --warn:#e3ab52; --pos-soft:#17301f; --neg-soft:#3a1d19; --warn-soft:#352914;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1116; --panel:#171a21; --sunk:#1e222b; --ink:#e7eaf0; --muted:#98a0ad;
  --line:#2b313c; --accent:#91a5ff; --accent-soft:#232b48;
  --pos:#58c98f; --neg:#ff7d6c; --warn:#e3ab52; --pos-soft:#17301f; --neg-soft:#3a1d19; --warn-soft:#352914;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);margin:0}
.page{padding-inline:clamp(16px,3vw,32px);padding-block:20px 40px;max-width:1500px;margin:0 auto;display:grid;gap:18px}
h1{font:600 22px/1.2 var(--cond);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;max-width:70ch}
.lbl{font:600 11px/1 var(--cond);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:grid;gap:4px;min-width:0}
.stat b{font:500 16px/1 var(--mono);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:min(360px,100%)}
input[type=search]:focus-visible,button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mosaic{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:18px;align-items:start}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column}
.tile>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.tile>header h2{font:600 15px/1.2 var(--cond);margin:0;letter-spacing:.02em}
.tile .body{padding:6px 0;max-height:70vh;overflow:auto}
.empty{color:var(--muted);padding:14px 16px;margin:0;max-width:65ch}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit;font:inherit}
.row:hover{background:var(--sunk)}
.row .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref{font:500 12px/1 var(--mono);background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:4px 6px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font:600 10.5px/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:4px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.chip.bad{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.grp{border-bottom:1px solid var(--line)}
.grp>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 16px;cursor:pointer}
.grp>button:hover{background:var(--sunk)}
.grp>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10.5px/1 var(--cond);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.scroll{overflow-x:auto}
/* tiroir */
.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);z-index:10}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:11;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside.drawer>header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
aside.drawer h3{font:600 18px/1.25 var(--cond);margin:4px 0 0;text-wrap:balance}
.close{font:inherit;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.dbody{overflow:auto;padding:4px 20px 30px;display:grid;gap:4px}
section.d{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:8px;min-width:0}
section.d p{margin:0;max-width:72ch}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 4px 4px 0;font-size:13px;max-width:72ch}
blockquote small{display:block;color:var(--muted);font:500 11px/1.4 var(--cond);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
pre{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px;font:12px/1.5 var(--mono);overflow:auto;max-height:460px;white-space:pre;tab-size:4}
pre.wrap{white-space:pre-wrap}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px;max-width:72ch}
.heat{display:grid;grid-template-columns:auto repeat(3,minmax(58px,1fr));gap:3px;font:12px var(--mono);max-width:420px}
.heat div{padding:6px 4px;text-align:center;border-radius:3px}
.heat .h{font:600 10.5px var(--cond);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.heat .r{text-align:left;color:var(--muted)}
.bars{display:grid;gap:4px;max-width:520px}
.bar{display:grid;grid-template-columns:42px 1fr 78px;gap:8px;align-items:center;font:12px var(--mono)}
.track{position:relative;height:12px;background:var(--sunk);border-radius:2px}
.track i{position:absolute;top:0;bottom:0;border-radius:2px}
.track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.note{color:var(--muted);font-size:12.5px;max-width:72ch;margin:0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:13px}
a{color:var(--accent)}
@media (max-width:640px){.row{grid-template-columns:auto 1fr}.row .chips{grid-column:1/-1;justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){aside.drawer{animation:in .16s ease-out}@keyframes in{from{transform:translateX(24px);opacity:.6}}}
</style>

<div class="page">
  <header class="top">
    <div>
      <h1>Pupitre de la Fabrique</h1>
      <p class="sub">Les hypothèses écrites avant toute mesure, et les IC que le harnais a inscrits au registre. Cette page recopie, elle ne calcule rien.</p>
    </div>
    <div class="tools"><input id="q" type="search" placeholder="Filtrer : H02, momentum, NQ…" aria-label="Filtrer"></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="mosaic">
    <section class="tile" aria-labelledby="t-h">
      <header><h2 id="t-h">Hypothèses</h2><span class="lbl" id="n-h"></span></header>
      <div class="body" id="hyps"></div>
    </section>
    <section class="tile" aria-labelledby="t-i">
      <header><h2 id="t-i">IC mesurés</h2><span class="lbl" id="n-i"></span></header>
      <div class="body" id="ics"></div>
    </section>
  </div>
  <p class="note" id="foot"></p>
</div>
<div class="veil" id="veil" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="d-title">
  <header><div><span class="lbl" id="d-kind"></span><h3 id="d-title"></h3></div><button class="close" id="close">Fermer</button></header>
  <div class="dbody" id="dbody"></div>
</aside>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d = 5) => v == null ? '—' : (v >= 0 ? '+' : '') + Number(v).toFixed(d);
const cls = v => v == null ? '' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const ASSETS = ['NQ','ES','YM','GC','CL','6E','6B','6J','6A'];
const WIN = ['ASIA','EUROPE','US'];
const WIN_FR = {ASIA:'Asie', EUROPE:'Europe', US:'US'};
let filtre = '';

/* --------------------------------------------------------------- bandeau */
function stats() {
  const lot = DATA.lot || {};
  const items = [
    ['Harnais', DATA.harness],
    ['Tests comptés', DATA.counted_tests],
    ['Lignes au registre', DATA.registry_lines],
    ['Lot', `${lot.with_hypothesis ?? 0} / ${lot.n ?? '—'} hypothèses`],
    ['Codages vérifiés', DATA.verified],
    ['Généré', DATA.generated.replace('T', ' ')],
  ];
  $('#stats').innerHTML = items.map(([k, v]) =>
    `<div class="stat"><span class="lbl">${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const b = DATA.base || {};
  $('#foot').textContent = 'Fenêtres en heure de New York : ' +
    Object.entries(DATA.windows).map(([k, v]) => `${WIN_FR[k] || k} ${v}`).join(' · ') +
    '. Chaque IC est recopié d\'une ligne du registre ou d\'un rapport officiel, avec son test_id.' +
    (b.asked ? (b.error ? ' Base de recherche injoignable : morceaux non reliés.' : ' Citations reliées aux morceaux de la base.') : '');
}

/* ------------------------------------------------------------ hypothèses */
function etatH(h) {
  const c = [];
  if (h.used_by.tests.length) c.push(['mesurée', 'ok']);
  if (h.concordance) c.push([h.concordance.verdict === 'CONCORDANT' ? 'codage vérifié' : 'discordant',
                            h.concordance.verdict === 'CONCORDANT' ? 'ok' : 'bad']);
  if (h.used_by.lot) c.push(['lot 09', '']);
  if (!h.used_by.tests.length) c.push(['pas encore mesurée', 'warn']);
  return c;
}
function correspondH(h) {
  if (!filtre) return true;
  return [h.ref, h.title, h.origin, h.claim, (h.signals || []).join(' '), h.paper?.title]
    .join(' ').toLowerCase().includes(filtre);
}
function listeH() {
  const hs = DATA.hypotheses.filter(correspondH);
  $('#n-h').textContent = `${hs.length} · ordre d'écriture`;
  $('#hyps').innerHTML = hs.length ? hs.map((h, i) => `
    <button class="row" data-h="${DATA.hypotheses.indexOf(h)}">
      <span class="ref">${esc(h.ref)}</span>
      <span class="t" title="${esc(h.title)}">${esc(h.title)}<br><span class="note">${esc(h.written || '')}${h.signals[0] ? ' · ' + esc(h.signals[0]) : ''}</span></span>
      <span class="chips">${etatH(h).map(([t, k]) => `<span class="chip ${k}">${esc(t)}</span>`).join('')}</span>
    </button>`).join('') : '<p class="empty">Aucune hypothèse ne correspond au filtre.</p>';
  document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => ouvrirH(DATA.hypotheses[+b.dataset.h]));
}

/* ------------------------------------------------------------------ IC */
function correspondI(r) {
  if (!filtre) return true;
  return [r.test_id, r.signal_id, r.hypothesis_ref, r.stage].join(' ').toLowerCase().includes(filtre);
}
function listeI() {
  const rs = DATA.ics.filter(correspondI);
  $('#n-i').textContent = `${rs.length} ligne(s) · ${rs.filter(r => r.stale).length} périmée(s)`;
  if (!rs.length) { $('#ics').innerHTML = '<p class="empty">Aucun IC ne correspond. Les IC du lot apparaîtront ici après sa mesure (étape 10).</p>'; return; }
  const groupes = new Map();
  for (const r of rs) { if (!groupes.has(r.hypothesis_ref)) groupes.set(r.hypothesis_ref, []); groupes.get(r.hypothesis_ref).push(r); }
  let html = '';
  for (const [ref, lignes] of groupes) {
    const ts = lignes.map(r => r.t_stat).filter(v => v != null);
    const ouvert = lignes.length <= 4 || !!filtre;
    html += `<div class="grp"><button aria-expanded="${ouvert}" data-g="${esc(ref)}">
      <span class="ref">${esc(ref)}</span>
      <span>${lignes.length} mesure(s) · ${esc([...new Set(lignes.map(r => r.signal_id.replace(/-(dent|creux)-.*/, '')))].join(', '))}</span>
      <span class="mono note">t ${num(Math.min(...ts), 2)} … ${num(Math.max(...ts), 2)}</span></button>
      <div class="scroll" ${ouvert ? '' : 'hidden'}><table><thead><tr>
        <th>signal</th><th>IC</th><th>t final</th><th>obs.</th><th>cell.</th><th>date</th><th></th></tr></thead><tbody>
      ${lignes.map(r => `<tr class="click" tabindex="0" data-i="${DATA.ics.indexOf(r)}">
        <td>${esc(r.signal_id)}</td><td class="${cls(r.ic)}">${num(r.ic)}</td>
        <td class="${cls(r.t_stat)}">${num(r.t_stat, 2)}</td>
        <td>${(r.observations ?? 0).toLocaleString('fr-FR')}</td><td>${r.cells ?? '—'}</td>
        <td>${esc((r.timestamp || '').slice(0, 10))}</td>
        <td>${r.stale ? '<span class="chip warn">périmé</span>' : '<span class="chip ok">courant</span>'}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }
  $('#ics').innerHTML = html;
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const box = b.nextElementSibling, on = box.hidden; box.hidden = !on; b.setAttribute('aria-expanded', on);
  });
  document.querySelectorAll('[data-i]').forEach(tr => {
    const go = () => ouvrirI(DATA.ics[+tr.dataset.i]);
    tr.onclick = go; tr.onkeydown = e => { if (e.key === 'Enter') go(); };
  });
}

/* --------------------------------------------------------------- tiroir */
let dernierFocus = null;
function tiroir(kind, title, html) {
  dernierFocus = document.activeElement;
  $('#d-kind').textContent = kind; $('#d-title').textContent = title;
  $('#dbody').innerHTML = html; $('#dbody').scrollTop = 0;
  $('#drawer').hidden = false; $('#veil').hidden = false; $('#close').focus();
}
function fermer() { $('#drawer').hidden = true; $('#veil').hidden = true; dernierFocus?.focus?.(); }
$('#close').onclick = fermer; $('#veil').onclick = fermer;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#drawer').hidden) fermer(); });
const sec = (titre, corps) => corps ? `<section class="d"><span class="lbl">${esc(titre)}</span>${corps}</section>` : '';
const para = t => t ? `<p>${esc(t)}</p>` : '';

function md(t) {
  return esc(t).replace(/^### (.*)$/gm, '<b>$1</b>').replace(/^## (.*)$/gm, '<b>$1</b>')
    .replace(/^# (.*)$/gm, '<b>$1</b>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
}

function ouAQuandH(h) {
  const nb = h.used_by.tests.length;
  const lignes = WIN.map(w => `<dt>${WIN_FR[w]}</dt><dd class="mono">${esc(DATA.windows[w] || '')} (New York)</dd>`).join('');
  return `<dl class="kv"><dt>Actifs</dt><dd>${ASSETS.join(', ')} — les cellules retenues de la grille (D01 §3)</dd>${lignes}
    <dt>Horizon</dt><dd>${esc(h.horizon || '30 minutes')}</dd><dt>Univers du papier</dt><dd>${esc(h.universe || '—')}</dd></dl>
    ${nb ? '<p class="note">La répartition actif × fenêtre de chaque mesure est dans la mosaïque des IC.</p>' : ''}`;
}

function ouvrirH(h) {
  const p = h.paper || {};
  const papier = p.title ? `<dl class="kv"><dt>Titre</dt><dd>${esc(p.title)}</dd><dt>Auteurs</dt><dd>${esc(p.authors || '—')}</dd>
    <dt>Année</dt><dd>${esc(p.year || '—')}</dd>${p.venue ? `<dt>Revue</dt><dd>${esc(p.venue)}</dd>` : ''}
    ${p.url ? `<dt>Source</dt><dd><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a></dd>` : ''}
    <dt>Fiche</dt><dd class="mono">${esc(h.fiche_file || '—')}</dd></dl>` : para(h.origin);
  const rec = h.recipe;
  const recette = rec ? `<dl class="kv"><dt>Formule</dt><dd>${esc(rec.formula?.statement || '—')}</dd>
      <dt>Moment du score</dt><dd>${esc(rec.timing?.statement || '—')}</dd></dl>
      ${(rec.parameters || []).length ? `<div class="scroll"><table><thead><tr><th>paramètre</th><th>valeur</th><th>unité</th></tr></thead><tbody>
      ${rec.parameters.map(x => `<tr><td>${esc(x.name)}</td><td>${x.value == null ? '<span class="chip warn">non dit</span>' : esc(x.value)}</td><td>${esc(x.unit || '')}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${(rec.ambiguities || []).length ? `<span class="lbl">Ambiguïtés relevées dans le papier (${rec.ambiguities.length})</span><ul class="plain">${rec.ambiguities.map(a =>
        `<li>${esc(a.question)}${a.resolution ? ` — <b>${esc(a.resolution)}</b>` : ' — <span class="chip warn">le papier se tait</span>'}</li>`).join('')}</ul>` : ''}` : '';
  const cites = h.quotes.length ? h.quotes.map(q => `<blockquote><small>${esc(q.from)}${q.name ? ' · ' + esc(q.name) : ''}${q.value != null ? ' · ' + esc(q.value) + ' ' + esc(q.unit || '') : ''}</small>« ${esc(q.quoted)} »</blockquote>`).join('') : '';
  const morceaux = h.chunks.length ? h.chunks.map(c => `<blockquote><small>morceau n° ${esc(c.ordinal)} · section ${esc(c.section)} · ${esc(c.source)}</small>${esc(c.content)}</blockquote>`).join('')
    : `<p class="note">${DATA.base?.asked ? (DATA.base.error ? 'Base injoignable à la génération.' : 'Aucun morceau de la base ne contient ces passages mot pour mot.') : 'Page générée sans la base : relancer avec --base pour relier les citations aux morceaux.'}</p>`;
  const cc = h.concordance;
  const conc = cc ? `<dl class="kv"><dt>Verdict</dt><dd><span class="chip ${cc.verdict === 'CONCORDANT' ? 'ok' : 'bad'}">${esc(cc.verdict)}</span></dd>
    <dt>ρ des scores</dt><dd class="mono">${cc.rho == null ? '—' : Number(cc.rho).toFixed(3)} (seuil 0,70)</dd>
    <dt>Couverture</dt><dd class="mono">${cc.coverage == null ? '—' : Number(cc.coverage).toFixed(3)} (seuil 0,80)</dd><dt>Tour</dt><dd>${esc(cc.round)}</dd></dl>`
    : (h.used_by.lot ? '<p class="note">Pas encore de double codage (D34).</p>' : '<p class="note">Hypothèse antérieure à D34 : signal écrit à la main, sans double codage.</p>');
  const tests = h.used_by.tests;
  const qui = `<dl class="kv"><dt>Lot</dt><dd>${esc(h.used_by.lot || '—')}</dd><dt>Signal</dt><dd class="mono">${esc(h.signals.join(', ') || '—')}</dd>
    <dt>Module</dt><dd class="mono">${esc(h.module || '—')}</dd><dt>Signe attendu</dt><dd class="mono">${esc(h.expected_sign ?? '—')}</dd>
    <dt>Mesures</dt><dd>${tests.length ? tests.length + ' ligne(s) au registre' : 'aucune'}</dd></dl>`;
  tiroir(`Hypothèse ${h.ref} · écrite le ${h.written || '—'}`, h.title,
    sec('Pourquoi — ce que le papier affirme', para(h.claim) || para(h.origin)) +
    sec('Le papier', papier) +
    sec('Où et quand', ouAQuandH(h)) +
    sec('Comment — la construction', para(h.construction) + recette) +
    sec('Ce qui se transpose, et ce qui ne se transpose pas', (h.transfers ? `<p><b>Se transpose :</b> ${esc(h.transfers)}</p>` : '') + (h.does_not_transfer ? `<p><b>Ne se transpose pas :</b> ${esc(h.does_not_transfer)}</p>` : '')) +
    sec('Choix du codeur (CHOICES)', h.choices.length ? `<ul class="plain">${h.choices.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : '<p class="note">Aucun CHOICES déclaré.</p>') +
    sec('Double codage', conc) +
    sec(`Passages du papier utilisés (${h.quotes.length})`, cites || '<p class="note">Aucune citation (hypothèse sans fiche).</p>') +
    sec(`Morceaux de la base qui les contiennent (${h.chunks.length})`, morceaux) +
    sec('Qui s\'en sert', qui) +
    sec('Le texte de l\'hypothèse', `<pre class="wrap">${md(h.markdown)}</pre>`) +
    sec('Le code du signal', h.code ? `<p class="note">${esc(h.module)} · version actuelle</p><pre>${esc(h.code)}</pre>` : ''));
}

function heat(r) {
  const cells = r.report?.cells || [];
  if (!cells.length) return '';
  const m = new Map(cells.map(c => [c.root + '|' + c.window, c]));
  const max = Math.max(...cells.map(c => Math.abs(c.ic || 0)), 1e-9);
  let h = '<div class="heat"><div></div>' + WIN.map(w => `<div class="h">${WIN_FR[w]}</div>`).join('');
  for (const a of ASSETS) {
    h += `<div class="r">${a}</div>`;
    for (const w of WIN) {
      const c = m.get(a + '|' + w);
      if (!c) { h += '<div class="note">—</div>'; continue; }
      const f = Math.min(1, Math.abs(c.ic) / max), col = c.ic >= 0 ? 'var(--pos)' : 'var(--neg)';
      h += `<div title="n = ${c.observations}" style="background:color-mix(in srgb,${col} ${Math.round(12 + f * 55)}%,transparent)">${num(c.ic, 4)}</div>`;
    }
  }
  return h + '</div><p class="note">IC par cellule — diagnostic, jamais des tests (D01 §4). Survoler une case donne son nombre d\'observations.</p>';
}
function annees(y) {
  const e = Object.entries(y || {});
  if (!e.length) return '';
  const max = Math.max(...e.map(([, v]) => Math.abs(v.ic || 0)), 1e-9);
  return '<div class="bars">' + e.map(([an, v]) => {
    const w = Math.abs(v.ic) / max * 50, left = v.ic >= 0 ? 50 : 50 - w;
    return `<div class="bar"><span>${an}</span><span class="track"><span class="mid"></span><i style="left:${left}%;width:${w}%;background:${v.ic >= 0 ? 'var(--pos)' : 'var(--neg)'}"></i></span><span class="${cls(v.ic)}">${num(v.ic, 4)}</span></div>`;
  }).join('') + '</div><p class="note">IC poolé par année civile (UTC) — diagnostic de stabilité, pas des tests (D29, D35).</p>';
}
function couts(r) {
  const cs = r.report?.costs || [];
  if (!cs.length) return '';
  const w = new Map((r.report.cells || []).map(c => [c.root + '|' + c.window, c.observations]));
  const ligne = (k, b) => {
    let s = 0, n = 0, pire = 0;
    for (const c of cs) {
      const fee = b === 'low' ? c.fee_low_bp : c.fee_high_bp;
      const v = c.floor_bp + (c.tick_bp == null ? 0 : 2 * k * c.tick_bp) + (fee || 0);
      const o = w.get(c.root + '|' + c.window) || 0; s += v * o; n += o; pire = Math.max(pire, v);
    }
    return `${(n ? s / n : NaN).toFixed(2)} / ${pire.toFixed(2)}`;
  };
  const manque = [...new Set(cs.flatMap(c => c.unknown || []))];
  return `<div class="scroll"><table><thead><tr><th>glissement / side</th><th>borne basse (moy. / pire)</th><th>borne haute (moy. / pire)</th></tr></thead><tbody>
    ${[1, 2, 3, 4, 5].map(k => `<tr><td>${k} tick${k > 1 ? 's' : ''}</td><td>${ligne(k, 'low')}</td><td>${ligne(k, 'high')}</td></tr>`).join('')}</tbody></table></div>
    ${manque.length ? `<p class="warnbox">Incomplet — manquent : ${esc(manque.join(', '))}. Ces coûts sont des planchers.</p>` : ''}
    <p class="note">Coût d'aller-retour en points de base, recopié des composantes du rapport (D35, D37).</p>`;
}

function ouvrirI(r) {
  const t = r.report?.t;
  const code = DATA.codes[r.code_key];
  const h = DATA.hypotheses.find(x => x.ref === r.hypothesis_ref);
  tiroir(`IC · ${r.hypothesis_ref} · ${r.test_id}`, r.signal_id,
    (r.stale ? `<p class="warnbox" style="margin-top:14px">Mesuré sous le harnais ${esc(r.code_hash)} ; le harnais courant est ${esc(DATA.harness)}. Ce résultat est périmé (D05) : il reste au registre et au décompte, mais aucune conclusion ne s'appuie plus dessus.</p>` : '') +
    sec('Le résultat', `<dl class="kv"><dt>IC poolé</dt><dd class="mono ${cls(r.ic)}">${num(r.ic, 6)}</dd>
      <dt>t final</dt><dd class="mono ${cls(r.t_stat)}">${num(r.t_stat, 4)}</dd>
      ${t ? `<dt>t naïf</dt><dd class="mono">${num(t.naive, 2)}</dd><dt>après recouvrement</dt><dd class="mono">${num(t.overlap, 2)} (÷ ${Number(t.overlap_factor).toFixed(2)})</dd>
      <dt>après coupe transversale</dt><dd class="mono">${num(t.final, 2)} (÷ ${Number(t.cross_section_factor).toFixed(2)})</dd>` : ''}
      <dt>Observations</dt><dd class="mono">${(r.observations ?? 0).toLocaleString('fr-FR')}</dd><dt>Cellules</dt><dd class="mono">${r.cells ?? '—'}</dd>
      <dt>Cibles D01 §2</dt><dd class="mono">0,018 (fenêtres indépendantes) · 0,031 (dépendantes)</dd></dl>`) +
    sec('Le cadre', `<dl class="kv"><dt>Hypothèse</dt><dd>${esc(r.hypothesis_ref)}${h ? ' — ' + esc(h.title) : ''}</dd>
      <dt>Étape</dt><dd class="mono">${esc(r.stage)}</dd><dt>Tranche</dt><dd class="mono">${esc(r.data_slice)} · as-of ${esc(r.asof || '—')}</dd>
      <dt>Horizon</dt><dd class="mono">${esc(r.horizon)}</dd><dt>Harnais</dt><dd class="mono">${esc(r.code_hash)}</dd>
      <dt>Inscrit le</dt><dd class="mono">${esc(r.timestamp)}</dd><dt>Test</dt><dd class="mono">${esc(r.test_id)}</dd></dl>`) +
    sec('Par actif et par fenêtre', heat(r) || '<p class="note">Rapport entier non conservé pour cette mesure : seules les valeurs du registre existent. Les mesures du lot gardent le leur (scripts/out/rapports/).</p>') +
    sec('Par année', annees(r.ic_by_year) || '<p class="note">IC par année : enregistré seulement depuis le harnais D35.</p>') +
    sec('Coûts', couts(r)) +
    (r.report?.warnings?.length ? sec('Avertissements', `<ul class="plain">${r.report.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`) : '') +
    (r.report?.render ? sec('Le rapport tel que le harnais l\'a rendu', `<pre>${esc(r.report.render)}</pre>`) : '') +
    sec('Le code du signal', code ? `<p class="note">${esc(code.path)} · ${esc(code.when)}</p><pre>${esc(code.source)}</pre>` : '<p class="note">Module introuvable.</p>'));
}

/* ---------------------------------------------------------------- départ */
$('#q').addEventListener('input', e => { filtre = e.target.value.trim().toLowerCase(); listeH(); listeI(); });
stats(); listeH(); listeI();
</script>
