# Catalogue des instruments — l'inventaire, et ce qu'on ne sait pas encore.
#
# Écrit en phase 02, gardé par catalogue/validate.py : chaque nombre recopié
# ici est revérifié contre sa source à chaque exécution du validateur. Un champ
# inconnu vaut null et ouvre une entrée dans `todos` — jamais une valeur
# plausible inventée (CLAUDE.md, « Les interdits »).
#
# Sources : le manifeste du fournisseur, scripts/out/a1_inventory.json,
# scripts/out/a8_session_grid.json, decisions/DECISION-01 et DECISION-03.

schema_version: 1
written: 2026-09-17
phase: 2

data:
  root_env: RSL_DATA_DIR
  provider: Databento
  manifest: manifeste.json
  manifest_generated: 2026-08-31
  granularity: 1 minute
  index: {name: ts_event, timezone: UTC}
  columns: [open, high, low, close, volume]
  splicing: raw  # séries recollées, pas ajustées à rebours (D01 §6)

# La grille actif × séance. Trois fenêtres disjointes, ancrées à l'horloge de
# la place et non à UTC (D01 §3). 16:00 → 19:00 n'appartient à aucune fenêtre.
grid:
  timezone: America/New_York
  windows:
    ASIA:   {start: "19:00", end: "03:00", crosses_midnight: true}
    EUROPE: {start: "03:00", end: "09:30", crosses_midnight: false}
    US:     {start: "09:30", end: "16:00", crosses_midnight: false}
  uncovered:
    start: "16:00"
    end: "19:00"
    reason: règlement et arrêt quotidien ; l'heure la plus mince de la journée

# La date de séance. Une séance va du soir (19:00, ouverture Globex) au
# lendemain 16:00 ; elle porte la date calendaire de sa fenêtre US. Décalée de
# +6 h sur l'horloge locale, une séance tombe sur une seule date (D03).
session_date:
  rule: la séance porte la date calendaire de sa fenêtre US
  anchor_shift_hours: 6

# Les tranches. Deux, pas trois (D01 §5).
slices:
  pool:    {start: 2016-01-03, end: 2023-12-31, status: open}
  holdout: {start: 2024-01-01, end: 2026-08-28, status: sealed, unseal_phase: 15}

# Règle de rétention des cellules, posée AVANT lecture des chiffres (D01 §3).
retention_rule:
  median_volume_per_minute_min: 10
  share_thin_bars_max: 0.25
  round_trip_over_move15_max: 0.333

