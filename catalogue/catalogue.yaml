# Ce qui est inconnu, et de qui on l'attend. Un null sans todo est un bug.
# Fermé le 2026-09-17 : roll-dates, reçu du fournisseur (voir roll_dates.json).
todos:
  - id: multipliers
    field: instruments[*].multiplier
    blocks: la complétude du coût -- sans eux le coût reste un plancher étiqueté (harness/costs.py)
    owed_by: >-
      fiche contrat EUREX, pour FDAX seul -- les neuf instruments CME sont
      déposés depuis le 2026-09-24 (voir provenance). FDAX exige aussi une
      conversion EUR -> USD avant que multiplier x prix soit un notionnel USD.
  - id: fees
    field: instruments[*].fee_per_contract_usd
    blocks: la complétude du coût -- sans eux le coût reste un plancher étiqueté (harness/costs.py)
    owed_by: >-
      Lucid Trading (prop firm) — son barème s'applique, pas la grille
      membre/non-membre du CME. Relevé le 2026-09-17 sur
      support.lucidtrading.com/en/articles/11508978 : 1,75 $/side sur NQ, ES et
      YM, 2,30 sur GC, 2,00 sur CL, 2,40 sur les quatre devises ; micros à 0,50
      (0,80 sur MGC). NON DÉPOSÉ ici : la page ne dit pas si ces montants sont
      all-in ou si exchange/clearing/NFA s'ajoutent, et la conversion en bp
      exige d'abord les multiplicateurs.
    note: >-
      jamais deviné ; la part fixe pèse dix fois plus lourd en micro (D01 §7), et
      les contrats effectivement tradés seront des MICROS quand les séries
      évaluées sont celles des minis — l'écart devra être écrit avant la phase 10.

# Les valeurs externes, et ce qui les atteste (D09).
#
# Une valeur recopiée d'un tiers n'entre au catalogue qu'accompagnée d'une
# entrée ici : `catalogue/validate.py` §8 refuse le catalogue sinon, et refuse
# symétriquement une entrée qui ne couvre plus rien. `quoted` porte les mots et
# les UNITÉS du tiers, tels quels — le validateur y cherche la valeur déposée,
# séparateurs ôtés, ce qui attrape la faute de recopie et non le menteur.
#
# La forme :
#
#   - id: cme-nq-contract-unit
#     source: CME Group -- fiche contrat E-mini Nasdaq-100
#     source_url: https://www.cmegroup.com/markets/equities/nasdaq/...
#     retrieved: 2026-09-18
#     quoted: "$20 x Nasdaq-100 Index"
#     applies_to: [instruments.NQ.multiplier]
#
# Le multiplicateur déposé est l'unité de contrat telle que
# `notionnel_usd = multiplier x prix` — vrai pour les neuf, quels que soient les
# mots du CME (« $20 x index », « 100 troy ounces », « 125,000 euro ») (D09).
#
# Multiplicateurs relevés le 2026-09-24 sur les fiches contrat du CME, par le
# navigateur (cmegroup.com refuse les clients HTTP nus, cf. D09 § Ce qui reste
# ouvert). Le code CME Globex affiché sur chaque page a été vérifié égal à la
# racine. Pour les devises, la cotation CME est « U.S. dollars ... per <devise> »,
# identique à nos séries (tick 5e-07 sur 6J) : multiplier x prix est bien en USD.
# FDAX reste null : son unité est en EUR (« EUR 25 per index point »), donc
# multiplier x prix n'est pas un notionnel en USD et la définition de D09 ne
# s'applique pas sans conversion -- et il est hors univers.
# fee_per_contract_usd reste null sur les dix : todo fees.
provenance:
  - id: cme-nq-contract-unit
    source: CME Group -- fiche contrat E-mini Nasdaq-100 Futures, ligne « Contract Unit »
    source_url: https://www.cmegroup.com/markets/equities/nasdaq/e-mini-nasdaq-100.contractSpecs.html
    retrieved: 2026-09-24
    quoted: "$20 x Nasdaq-100 Index"
    applies_to: [instruments.NQ.multiplier]
  - id: cme-es-contract-unit
    source: CME Group -- fiche contrat E-mini S&P 500 Futures, ligne « Contract Unit »
    source_url: https://www.cmegroup.com/markets/equities/sp/e-mini-sandp500.contractSpecs.html
    retrieved: 2026-09-24
    quoted: "$50 x S&P 500 Index"
    applies_to: [instruments.ES.multiplier]
  - id: cme-ym-contract-unit
